name: Sync tours

on:
  schedule:
    # Every hour — Isabel's sheet edits show up on the site within ~1 hour
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch tours from Google Sheet
        run: npm run sync:tours
        env:
          TOURS_SHEET_CSV_URL: ${{ secrets.TOURS_SHEET_CSV_URL }}

      - name: Commit updated tours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tours.json
          if git diff --staged --quiet; then
            echo "No tour changes."
          else
            git commit -m "chore: sync tours from Google Sheet"
            git push
          fi
